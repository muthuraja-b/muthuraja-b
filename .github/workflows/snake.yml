
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: muthuraja-b
          outputs: dist/snake.svg

      - name: Fix file permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod u+rw dist/snake.svg

      - name: Slow down snake animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("dist/snake.svg")
          svg = path.read_text()

          svg, count = re.subn(
              r'(\d+(?:\.\d+)?)ms',
              lambda m: f'{float(m.group(1)) * 4:g}ms',
              svg
          )

          if count == 0:
              raise SystemExit("Animation duration not found!")

          path.write_text(svg)

          print(f"Successfully slowed {count} animations.")

          PY

      - name: Deploy Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
