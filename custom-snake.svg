
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <defs>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#00a86b"/>
    </linearGradient>
  </defs>

  <path id="route"
    d="M 25 110 C 130 10, 230 10, 330 110 S 530 210, 630 110 S 830 10, 975 110"
    fill="none" stroke="#39ff88" stroke-opacity=".12"
    stroke-width="3" stroke-dasharray="5 10"/>

  <!-- Food points -->
  <g>
    <g fill="#ff5252">
      <circle cx="95" cy="35" r="9"/>
      <circle cx="190" cy="175" r="9"/>
      <circle cx="280" cy="35" r="9"/>
      <circle cx="380" cy="175" r="9"/>
      <circle cx="470" cy="35" r="9"/>
      <circle cx="560" cy="175" r="9"/>
      <circle cx="660" cy="35" r="9"/>
      <circle cx="750" cy="175" r="9"/>
      <circle cx="850" cy="35" r="9"/>
      <circle cx="930" cy="175" r="9"/>
    </g>
    <g fill="#39ff88">
      <ellipse cx="100" cy="24" rx="5" ry="3" transform="rotate(-35 100 24)"/>
      <ellipse cx="195" cy="164" rx="5" ry="3"/>
      <ellipse cx="285" cy="24" rx="5" ry="3"/>
      <ellipse cx="385" cy="164" rx="5" ry="3"/>
      <ellipse cx="475" cy="24" rx="5" ry="3"/>
      <ellipse cx="565" cy="164" rx="5" ry="3"/>
      <ellipse cx="665" cy="24" rx="5" ry="3"/>
      <ellipse cx="755" cy="164" rx="5" ry="3"/>
      <ellipse cx="855" cy="24" rx="5" ry="3"/>
      <ellipse cx="935" cy="164" rx="5" ry="3"/>
    </g>
  </g>

  <!-- Animated snake body -->
  <g fill="url(#snake)" stroke="#087f50" stroke-width="1">
    <circle r="11"><animateMotion dur="20s" begin="-18s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-16.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-15s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-13.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-12s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-10.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-9s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-7.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-4.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="11"><animateMotion dur="20s" begin="-3s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  </g>

  <!-- Snake head -->
  <g>
    <circle r="14" fill="#39ff88" stroke="#087f50" stroke-width="2"/>
    <circle cx="5" cy="-5" r="2.5" fill="#10251a"/>
    <circle cx="5" cy="5" r="2.5" fill="#10251a"/>
    <animateMotion dur="20s" repeatCount="indefinite">
      <mpath href="#route"/>
    </animateMotion>
  </g>
</svg>
